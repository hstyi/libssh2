name: Build Android
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/ndk
          key: ${{ runner.os }}-${{ runner.arch }}-ndk
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ndk


      - name: Check if NDK exists
        id: check-ndk
        run: |
          if [ -d "$HOME/ndk" ]; then
            echo "NDK exists"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "NDK not found"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        if: steps.check-ndk.outputs.exists == 'false'
        with:
          ndk-version: r21e

      - name: Build
        run: |
          ./build-zlib-android.sh
          ./build-openssl-android.sh
          ./build-libssh2-android.sh
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload openssl artifact
        uses: actions/upload-artifact@v4
        with:
          name: openssl-android
          path: |
            openssl-android-build/*/lib/*.a

      - name: Upload zlib artifact
        uses: actions/upload-artifact@v4
        with:
          name: zlib-android
          path: |
            zlib-android-build/*/lib/*.a

      - name: Upload libssh2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: libssh2-android
          path: |
            libssh2-android-build/*/lib/*.a
            libssh2-android-build/*/lib/*.so